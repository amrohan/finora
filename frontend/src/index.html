<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Finora - Personal & Family Wealth Management</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Personal and multi-member family wealth management web application and PWA.">
  
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finora">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">

  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900 antialiased font-sans">
  <app-root></app-root>
  <noscript>Please enable JavaScript to run Finora.</noscript>

  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('SW registration skipped:', err);
        });
      });
    }
  </script>
</body>
</html>
